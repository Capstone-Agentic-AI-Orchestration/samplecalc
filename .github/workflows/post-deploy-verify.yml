# Generated by Alpha from Capstone-Agentic-AI-Orchestration/alphaorch-workflow@v1:workflow-templates/product/post-deploy-verify.yml.
# Hosting is set up separately by Alpha, on Render.
# Alpha-hosted post-deploy check. Alpha writes this to .github/workflows/post-deploy-verify.yml
# in a repository it hosts, next to ci.yml.
#
# Runs when the hosting platform reports a successful GitHub deployment and checks that the
# deployment answers. Vercel's GitHub app reports every deployment, so frontends are checked
# automatically. Render is not documented to report GitHub deployments; run this by hand for a
# backend (Actions -> Post-deploy verify -> Run workflow, with the service URL and /health).

name: "Post-deploy verify"

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "The deployed URL to check"
        required: true
        type: string
      health_path:
        description: "Path to request; /health for a backend"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/post-deploy-verify.yml@v1
    with:
      base-url: ${{ github.event_name == 'workflow_dispatch' && inputs.url || github.event.deployment_status.environment_url }}
      health-path: ${{ github.event_name == 'workflow_dispatch' && inputs.health_path || '' }}
      environment-name: ${{ github.event.deployment.environment || 'manual' }}
