# Generated by Alpha from Capstone-Agentic-AI-Orchestration/alphaorch-workflow@v1:workflow-templates/product/be-nodejs.yml.
# Hosting is set up separately by Alpha, on Render.
# Alpha-hosted nodejs caller: the quality jobs of workflow-templates/customer/be-nodejs.yml, with no deploy job.
# Alpha writes this to .github/workflows/ci.yml in a repository it hosts. Render deploys that
# repository through its own GitHub app, so CI never deploys and needs no deploy secrets.

name: "Backend CI"

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name for display and artifacts"
        required: true
        type: string
        default: "backend"
      service_path:
        description: "Relative path to the backend service"
        required: false
        type: string
        default: "."
      node_version:
        description: "Node.js version"
        required: false
        type: number
        default: 24
      coverage_threshold:
        description: "Minimum coverage percentage"
        required: false
        type: number
        default: 80
      enforce_coverage:
        description: "Fail when coverage is below threshold or missing"
        required: false
        type: boolean
        default: true
      docker_image:
        description: "Optional image name. Leave empty to skip Docker build."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write


jobs:
  unit-tests:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/backend-tests.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      backend-stack: nodejs
      node-version: ${{ inputs.node_version || 24 }}
      coverage-threshold: ${{ inputs.coverage_threshold || 80 }}
      enforce-coverage: ${{ inputs.enforce_coverage != false }}

  lint:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/lint-check.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      node-version: ${{ inputs.node_version || 24 }}

  security:
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/security-scan.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      system-name: ${{ inputs.service_name || 'backend' }}
      node-version: ${{ inputs.node_version || 24 }}
      fail-on-high: true

  docker:
    needs: [unit-tests, lint, security]
    if: ${{ inputs.docker_image != '' }}
    uses: Capstone-Agentic-AI-Orchestration/alphaorch-workflow/.github/workflows/docker-build.yml@v1
    with:
      working-directory: ${{ inputs.service_path || '.' }}
      image-name: ${{ inputs.docker_image }}
      push-image: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      scan-vulnerabilities: true
